# Démarrage : docker compose up -d --build
# Premier compte : docker compose exec app node src/seed.js --admin --meals --hours
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: velona
      POSTGRES_USER: velona
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans le fichier .env à la racine}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velona"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://velona:${DB_PASSWORD}@db:5432/velona
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  uploads:
